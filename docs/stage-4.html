<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage Four | McRae Project</title>
    <link rel="stylesheet" href="assets/css/site-v2.css">
  </head>
  <body class="stage-page">
<main class="stage-shell" aria-labelledby="stage-title">
      <section class="stage-intro compact">
        <h1 id="stage-title">Stage Four - Seb</h1>
      </section>

      <section class="video-panel" aria-label="Seb birthday message">
        <video controls preload="metadata" poster="assets/images/video-placeholder.svg">
          <source src="assets/videos/seb-message.mp4" type="video/mp4">
          Your browser does not support embedded video.
        </video>
      </section>

      <section class="answer-panel" aria-label="Stage four puzzle">
        <form class="answer-form" id="morse-form">
          <label for="morse-answer">Answer</label>
          <div class="answer-row">
            <input id="morse-answer" name="answer" type="text" autocomplete="off">
            <button type="submit">Unlock</button>
          </div>
        </form>
        <p class="answer-feedback" id="morse-feedback" aria-live="polite"></p>


</section>
    </main>

    <script>
      const form = document.querySelector("#morse-form");
      const input = document.querySelector("#morse-answer");
      const feedback = document.querySelector("#morse-feedback");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const answer = input.value.trim().toLowerCase();

        if (answer === "sixstring" || answer === "6" || answer === "six") {
          feedback.innerHTML = "Correct. <a href=\"stage-5.html\">Continue to Stage Five</a>.";
          feedback.className = "answer-feedback success";
        } else {
          feedback.textContent = "Not quite.";
          feedback.className = "answer-feedback error";
        }
      });
    </script>
  </body>
</html>
