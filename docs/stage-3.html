<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage Three | McRae Project</title>
    <link rel="stylesheet" href="assets/css/site-v2.css">
  </head>
  <body class="stage-page">
<main class="stage-shell" aria-labelledby="stage-title">
      <section class="stage-intro compact">
        <h1 id="stage-title">Stage Three - Mum</h1>
      </section>

      <section class="video-panel" aria-label="Mum birthday message">
        <video controls preload="metadata" poster="assets/images/video-placeholder.svg">
          <source src="assets/videos/mum-message.mp4" type="video/mp4">
          Your browser does not support embedded video.
        </video>
      </section>

      <section class="answer-panel" aria-label="Stage three puzzle">
        <article class="transcript-card" aria-label="Transcript">
          <div class="transcript-paper" id="transcript"></div>
        </article>

        <div class="word-lock" aria-live="polite">
          <span id="marked-code">------</span>
          <button type="button" id="clear-transcript">Clear</button>
        </div>
        <p class="answer-feedback" id="mum-feedback" aria-live="polite"></p>


</section>
    </main>

    <script>
      const transcript = [
        "P.S.",
        "I had this funny dream about you last night. I tried to write it down quickly, but some of the details are jumbled. I'm not sure which ones, though.",
        "You were in the backyard, drinking soda with your childhood black dog, Harold. I was sure it was your birthday, because the calendar said August.",
        "But that's when your friend from primary school, Xavier Dunning, rocked up, right before the ostrich arrived and explained that you had turned into a wizard.",
        "Love you!",
      ];
      const solution = "shadow";
      const selected = new Set();
      const transcriptElement = document.querySelector("#transcript");
      const codeElement = document.querySelector("#marked-code");
      const feedback = document.querySelector("#mum-feedback");
      const clearButton = document.querySelector("#clear-transcript");

      const wordPattern = /[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g;
      const renderTranscript = () => {
        transcriptElement.innerHTML = "";

        transcript.forEach((paragraph, paragraphIndex) => {
          const p = document.createElement("p");
          const parts = paragraph.match(wordPattern) || [];
          let wordIndex = 0;

          parts.forEach((part) => {
            if (/^[A-Za-z]/.test(part)) {
              const button = document.createElement("button");
              const id = `${paragraphIndex}-${wordIndex}`;
              button.type = "button";
              button.className = "transcript-word";
              button.textContent = part;
              button.dataset.word = part;
              button.dataset.wordId = id;
              button.setAttribute("aria-pressed", selected.has(id) ? "true" : "false");
              if (selected.has(id)) {
                button.classList.add("selected");
              }
              button.addEventListener("click", () => toggleWord(id));
              p.appendChild(button);
              wordIndex += 1;
            } else {
              p.append(part);
            }
          });

          transcriptElement.appendChild(p);
        });
      };

      const getMarkedCode = () => {
        return [...document.querySelectorAll(".transcript-word.selected")]
          .map((word) => word.dataset.word[0].toLowerCase())
          .join("");
      };

      const updateCode = () => {
        const code = getMarkedCode();
        codeElement.textContent = code.padEnd(solution.length, "-").slice(0, Math.max(solution.length, code.length)).toUpperCase();

        if (code === solution) {
          feedback.innerHTML = "Correct. <a href=\"stage-4.html\">Continue to Stage Four</a>.";
          feedback.className = "answer-feedback success";
        } else if (code.length >= solution.length) {
          feedback.textContent = "Not quite.";
          feedback.className = "answer-feedback error";
        } else {
          feedback.textContent = "";
          feedback.className = "answer-feedback";
        }
      };

      const toggleWord = (id) => {
        if (selected.has(id)) {
          selected.delete(id);
        } else {
          selected.add(id);
        }

        renderTranscript();
        updateCode();
      };

      clearButton.addEventListener("click", () => {
        selected.clear();
        renderTranscript();
        updateCode();
      });

      renderTranscript();
      updateCode();
    </script>
  </body>
</html>
