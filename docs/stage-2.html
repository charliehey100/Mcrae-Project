<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage Two | McRae Project</title>
    <link rel="stylesheet" href="assets/css/site-v2.css">
  </head>
  <body class="stage-page">
<main class="stage-shell" aria-labelledby="stage-title">
      <section class="stage-intro compact">
        <h1 id="stage-title">Stage Two - Oscar</h1>
      </section>

      <section class="video-panel" aria-label="Oscar birthday message">
        <video controls preload="metadata" poster="assets/images/video-placeholder.svg">
          <source src="assets/videos/oscar-message.mp4" type="video/mp4">
          Your browser does not support embedded video.
        </video>
      </section>

      <section class="answer-panel" aria-label="Stage two puzzle">
        <div class="movement-layout">
          <div class="movement-grid" id="movement-grid" aria-label="Movement grid"></div>
          <div class="movement-status">
            <p class="kicker">Trace</p>
            <strong id="step-count">--------</strong>
            <p id="movement-feedback" class="answer-feedback" aria-live="polite"></p>
            <div class="arrow-pad" aria-label="Arrow key fallback controls">
              <button type="button" data-direction="up" aria-label="Move up">U</button>
              <button type="button" data-direction="left" aria-label="Move left">L</button>
              <button type="button" data-direction="down" aria-label="Move down">D</button>
              <button type="button" data-direction="right" aria-label="Move right">R</button>
            </div>
          </div>
        </div>


</section>
    </main>

    <script>
      const size = 7;
      const start = { x: 3, y: 3 };
      const solution = [
        "up",
        "right",
        "left",
        "up",
        "down",
        "right",
        "down",
        "left",
      ];
      const symbols = {
        up: "U",
        down: "D",
        left: "L",
        right: "R",
      };
      const deltas = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 },
      };
      const grid = document.querySelector("#movement-grid");
      const count = document.querySelector("#step-count");
      const feedback = document.querySelector("#movement-feedback");
      let position = { ...start };
      let trace = [];
      let unlocked = false;

      const render = () => {
        grid.innerHTML = "";
        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            const tile = document.createElement("div");
            tile.className = "movement-tile";
            if (x === position.x && y === position.y) {
              tile.classList.add("current");
            }
            grid.appendChild(tile);
          }
        }
        count.textContent = trace.map((direction) => symbols[direction]).join("").padStart(solution.length, "-");
      };

      const move = (direction) => {
        if (unlocked) return;

        position = {
          x: (position.x + deltas[direction].x + size) % size,
          y: (position.y + deltas[direction].y + size) % size,
        };

        trace.push(direction);
        if (trace.length > solution.length) {
          trace = trace.slice(trace.length - solution.length);
        }

        feedback.textContent = "";
        feedback.className = "answer-feedback";

        if (trace.join("|") === solution.join("|")) {
          unlocked = true;
          feedback.innerHTML = "Correct. <a href=\"stage-3.html\">Continue to Stage Three</a>.";
          feedback.className = "answer-feedback success";
        }

        render();
      };

      document.addEventListener("keydown", (event) => {
        const keyMap = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
        };
        const direction = keyMap[event.key];
        if (direction) {
          event.preventDefault();
          move(direction);
        }
      });

      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.addEventListener("click", () => move(button.dataset.direction));
      });

      render();
    </script>
  </body>
</html>
