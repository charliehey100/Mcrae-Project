<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage Six | McRae Project</title>
    <link rel="stylesheet" href="assets/css/site-v2.css">
  </head>
  <body class="stage-page">
<main class="stage-shell" aria-labelledby="stage-title">
      <section class="stage-intro compact">
        <h1 id="stage-title">Stage Six - Charlie</h1>
      </section>

      <section class="video-panel" aria-label="Charlie birthday message">
        <div class="video-frame">
          <video controls preload="metadata" poster="assets/images/video-placeholder.svg">
            <source src="assets/videos/charlie-message.mp4" type="video/mp4">
            Your browser does not support embedded video.
          </video>
          <a
            class="fake-download"
            href="assets/videos/charlie-message.mp4"
            download="birthday_message__drive-folder-1jPvUtD7oh05kGE8o4vmQX6U58bOA4QVN.mp4"
            aria-label="Download suspicious birthday file"
            title="Download suspicious file"
          >
            <span aria-hidden="true"></span>
          </a>
        </div>
      </section>

      <section class="answer-panel" aria-label="Stage six puzzle">
        <form class="answer-form" id="arg-form">
          <label for="arg-answer">Keyword</label>
          <div class="answer-row">
            <input id="arg-answer" name="answer" type="text" autocomplete="off">
            <button type="submit">Unlock</button>
          </div>
        </form>
        <p class="answer-feedback" id="arg-feedback" aria-live="polite"></p>



</section>
    </main>

    <div class="end-screen" id="end-screen" aria-live="assertive" aria-hidden="true">
      <p class="end-screen__lead">And your reward is...</p>
      <p class="end-screen__final">
        Having us as friends and family! What were you expecting? Happy birthday!
      </p>
    </div>

    <script>
      const form = document.querySelector("#arg-form");
      const input = document.querySelector("#arg-answer");
      const feedback = document.querySelector("#arg-feedback");
      const endScreen = document.querySelector("#end-screen");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const answer = input.value.trim().toLowerCase();

        if (answer === "oozwlar") {
          feedback.textContent = "";
          feedback.className = "answer-feedback";
          endScreen.removeAttribute("aria-hidden");
          document.body.classList.add("ending");
          endScreen.className = "end-screen active lead";

          window.setTimeout(() => {
            endScreen.classList.add("pause");
          }, 2800);

          window.setTimeout(() => {
            endScreen.className = "end-screen active final";
          }, 4300);
        } else {
          feedback.textContent = "Not yet.";
          feedback.className = "answer-feedback error";
        }
      });
    </script>
  </body>
</html>
