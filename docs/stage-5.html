<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage Five | McRae Project</title>
    <link rel="stylesheet" href="assets/css/site-v2.css">
  </head>
  <body class="stage-page">
    <nav class="dev-stage-nav" aria-label="Development stage selector">
      <span>Dev</span>
      <a href="index.html">Home</a>
      <a href="stage-1.html">1</a>
      <a href="stage-2.html">2</a>
      <a href="stage-3.html">3</a>
      <a href="stage-4.html">4</a>
      <a href="stage-5.html">5</a>
      <a href="stage-6.html">6</a>
    </nav>

    <main class="stage-shell" aria-labelledby="stage-title">
      <section class="stage-intro compact">
        <h1 id="stage-title">Stage Five - Anna</h1>
      </section>

      <section class="video-panel" aria-label="Anna birthday message">
        <video controls preload="metadata" poster="assets/images/video-placeholder.svg">
          <source src="assets/videos/anna-message.mp4" type="video/mp4">
          Your browser does not support embedded video.
        </video>
        <p class="video-note">
          Anna's birthday message is embedded here.
        </p>
      </section>

      <section class="answer-panel" aria-label="Stage five puzzle">
        <div class="page-reader">
          <div class="book-page" id="book-page" aria-live="polite">
            <div class="page-number" id="page-number"></div>
            <div class="poem-page" id="poem-page"></div>
          </div>
          <div class="page-actions">
            <button type="button" id="previous-page">Previous page</button>
            <button type="button" id="next-page">Next page</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const basePoem = [
        "Fox in a box, the clock clicks twice,",
        "Keys sleep under paper and dice.",
        "One room hums while another one waits,",
        "Candles lean toward hidden gates.",
        "If the page is wrong, retrace the track,",
        "If nothing has shifted, do not look back.",
      ];
      const pages = [
        { type: "normal" },
        { type: "anomaly", variant: "caps" },
        { type: "normal" },
        { type: "anomaly", variant: "roman" },
        { type: "anomaly", variant: "misspell" },
        { type: "normal" },
        { type: "anomaly", variant: "small" },
        { type: "normal" },
        { type: "anomaly", variant: "reorder" },
        { type: "anomaly", variant: "synonym" },
        { type: "normal" },
        { type: "anomaly", variant: "zalgo" },
        { type: "anomaly", variant: "meta" },
        { type: "normal" },
        { type: "complete" },
      ];
      const pageNumber = document.querySelector("#page-number");
      const bookPage = document.querySelector("#book-page");
      const poemPage = document.querySelector("#poem-page");
      const previousButton = document.querySelector("#previous-page");
      const nextButton = document.querySelector("#next-page");
      let currentPage = 0;
      let turning = false;

      const getLines = (page) => {
        if (page.variant === "caps") {
          return basePoem.map((line) => line.toUpperCase());
        }
        if (page.variant === "misspell") {
          return basePoem.map((line) => line.replace("Candles", "Candels"));
        }
        if (page.variant === "synonym") {
          return basePoem.map((line) => line.replace("hidden", "secret"));
        }
        if (page.variant === "reorder") {
          return [
            basePoem[0],
            basePoem[3],
            basePoem[2],
            basePoem[1],
            basePoem[4],
            basePoem[5],
          ];
        }
        if (page.variant === "zalgo") {
          return basePoem.map((line) => {
            return line
              .split("")
              .map((char, index) => /[A-Za-z]/.test(char) ? `${char}${index % 2 ? "\u0335" : "\u0337"}` : char)
              .join("");
          });
        }
        return basePoem;
      };

      const romanize = (number) => {
        const numerals = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV"];
        return numerals[number] || String(number);
      };

      const render = () => {
        const page = pages[currentPage];
        pageNumber.textContent = page.variant === "roman" ? `Page ${romanize(currentPage + 1)}` : `Page ${currentPage + 1}`;
        bookPage.className = "book-page";
        poemPage.className = "poem-page";
        poemPage.innerHTML = "";

        if (page.type === "complete") {
          bookPage.classList.add("complete");
          poemPage.innerHTML = "<p>You found the way through.</p><p>The next page is waiting.</p>";
          previousButton.disabled = true;
          nextButton.disabled = false;
          nextButton.textContent = "Next page";
          return;
        }

        if (page.variant) {
          bookPage.classList.add(`anomaly-${page.variant}`);
          poemPage.classList.add(`anomaly-${page.variant}`);
        }

        getLines(page).forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          poemPage.appendChild(p);
        });

        previousButton.disabled = currentPage === 0;
        nextButton.disabled = false;
        nextButton.textContent = "Next page";
      };

      const turnPage = (direction) => {
        if (turning) return;
        const page = pages[currentPage];

        if (page.type === "complete" && direction === "next") {
          window.location.href = "stage-6.html";
          return;
        }

        turning = true;
        previousButton.disabled = true;
        nextButton.disabled = true;
        document.querySelector(".page-reader").classList.add("turning");

        setTimeout(() => {
        if (page.type === "anomaly") {
          currentPage = direction === "previous" ? currentPage + 1 : 0;
        } else {
          currentPage = direction === "next" ? currentPage + 1 : 0;
        }

        render();
        requestAnimationFrame(() => {
          document.querySelector(".page-reader").classList.remove("turning");
          turning = false;
        });
        }, 260);
      };

      previousButton.addEventListener("click", () => turnPage("previous"));
      nextButton.addEventListener("click", () => turnPage("next"));
      render();
    </script>
  </body>
</html>
