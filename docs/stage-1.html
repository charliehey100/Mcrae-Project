<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage One | McRae Project</title>
    <link rel="stylesheet" href="assets/css/site-v2.css">
  </head>
  <body class="stage-page">
    <nav class="dev-stage-nav" aria-label="Development stage selector">
      <span>Dev</span>
      <a href="index.html">Home</a>
      <a href="stage-1.html">1</a>
      <a href="stage-2.html">2</a>
      <a href="stage-3.html">3</a>
      <a href="stage-4.html">4</a>
      <a href="stage-5.html">5</a>
      <a href="stage-6.html">6</a>
    </nav>

    <main class="stage-shell" aria-labelledby="stage-title">
      <section class="stage-intro compact">
        <h1 id="stage-title">Stage One - Lila</h1>
      </section>

      <section class="video-panel" aria-label="Lila birthday message">
        <video controls preload="metadata" poster="assets/images/video-placeholder.svg">
          <source src="assets/videos/lila-message.mp4" type="video/mp4">
          Your browser does not support embedded video.
        </video>
        <p class="video-note">
          Placeholder video slot: replace
          <code>assets/videos/lila-message.mp4</code> once the recording is ready.
        </p>
      </section>

      <section class="answer-panel" aria-label="Stage one puzzle">
        <div class="roman-lock">
          <div class="roman-display" id="roman-display" aria-live="polite">----</div>
          <div class="roman-keypad" aria-label="Roman numeral keypad">
            <button type="button" data-value="1">I</button>
            <button type="button" data-value="2">II</button>
            <button type="button" data-value="3">III</button>
            <button type="button" data-value="4">IV</button>
            <button type="button" data-value="5">V</button>
            <button type="button" data-value="6">VI</button>
            <button type="button" data-value="7">VII</button>
            <button type="button" data-value="8">VIII</button>
            <button type="button" data-value="9">IX</button>
          </div>
          <div class="roman-actions">
            <button type="button" id="clear-code">Clear</button>
          </div>
        </div>
        <p class="answer-feedback" id="stage-one-feedback" aria-live="polite"></p>

        <details class="hint">
          <summary>Hint 1</summary>
          <p>Some birthday wishes count more than others.</p>
        </details>
        <details class="hint">
          <summary>Hint 2</summary>
          <p>Listen for numbers, then keep their order.</p>
        </details>
      </section>
    </main>

    <script>
      const solution = "3521";
      const numerals = {
        1: "I",
        2: "II",
        3: "III",
        4: "IV",
        5: "V",
        6: "VI",
        7: "VII",
        8: "VIII",
        9: "IX",
      };
      const display = document.querySelector("#roman-display");
      const feedback = document.querySelector("#stage-one-feedback");
      const clearButton = document.querySelector("#clear-code");
      let entry = "";

      const render = () => {
        display.textContent = entry
          ? entry.split("").map((digit) => numerals[digit]).join(" ")
          : "----";
      };

      const submitDigit = (digit) => {
        entry = `${entry}${digit}`.slice(-solution.length);
        feedback.textContent = "";
        feedback.className = "answer-feedback";
        render();

        if (entry === solution) {
          feedback.innerHTML = "Correct. <a href=\"stage-2.html\">Continue to Stage Two</a>.";
          feedback.className = "answer-feedback success";
        } else if (entry.length === solution.length) {
          feedback.textContent = "Not quite.";
          feedback.className = "answer-feedback error";
        }
      };

      document.querySelectorAll("[data-value]").forEach((button) => {
        button.addEventListener("click", () => submitDigit(button.dataset.value));
      });

      clearButton.addEventListener("click", () => {
        entry = "";
        feedback.textContent = "";
        feedback.className = "answer-feedback";
        render();
      });

      render();
    </script>
  </body>
</html>
