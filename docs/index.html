<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>McRae Project</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        align-items: center;
        background: #10131a;
        color: #f7efe0;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 680px;
        padding: 32px;
        text-align: center;
      }

      .label {
        color: #d6a85f;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        line-height: 0.95;
        margin: 16px 0;
      }

      p {
        color: #d8d4ca;
        font-size: 1.1rem;
        line-height: 1.6;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Functionality Test</div>
      <h1>The game is waking up.</h1>
      <p>
        If you can see this page on GitHub Pages, Codex can help build the
        escape room framework here.
      </p>
    </main>
  </body>
</html>
